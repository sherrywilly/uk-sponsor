services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recruitops-backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./output/recruitment.db
      QUEUE_CONCURRENCY: "2"
      MAX_JOBS_PER_COMPANY: "25"
      CACHE_TTL_SECONDS: "86400"
      HEADLESS: "true"
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o}
      OPENAI_API_KEY:
      ANTHROPIC_API_KEY:
      OPENROUTER_API_KEY:
    volumes:
      - ./output:/app/output
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: platform_dashboard/Dockerfile
    container_name: recruitops-dashboard
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
