[project]
name = "job-agent"
version = "0.1.0"
description = "AI Job Application Agent with replay-first automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.30.0",
  "playwright>=1.54.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "python-docx>=1.1.2",
  "anthropic>=0.41.0",
  "aiosqlite>=0.20.0",
  "tiktoken>=0.9.0",
  "loguru>=0.7.2",
  "python-dotenv>=1.0.1",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
